services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mindatlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mindatlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mindatlas-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mindatlas}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2023-08-16T20-17-30Z
    container_name: mindatlas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    networks:
      - mindatlas-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # MinIO Initialization (one-time)
  minio-init:
    image: minio/mc
    container_name: mindatlas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: [ "/bin/sh", "/minio-init.sh" ]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mindatlas}
      ASSISTANT_ARTIFACT_BUCKET: ${ASSISTANT_ARTIFACT_BUCKET:-mindatlas-assistant-artifacts}
    networks:
      - mindatlas-network

  # Neo4j Graph Database (for LightRAG)
  neo4j:
    image: neo4j:5-community
    container_name: mindatlas-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt
    networks:
      - mindatlas-network
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Database Migration (one-time)
  db-migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrate
    container_name: mindatlas-db-migrate
    volumes:
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: [ "/bin/sh", "/migrate.sh" ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mindatlas}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mindatlas-network

  # Backend API
  # Production-like deploys must set a non-development APP_BUILD_REVISION
  # (required substitution below). For local quick-start, use
  # docker-compose.override.yml or export APP_BUILD_REVISION / APP_ENV.
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
      args:
        # Require an explicit revision for image labels (no development default).
        APP_BUILD_REVISION: ${APP_BUILD_REVISION:?Set APP_BUILD_REVISION to a deployment-immutable value}
    container_name: mindatlas-api
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mindatlas}
      # Quick-start friendly defaults. Override these from `.env` in production if needed.
      AI_PROVIDER_FERNET_KEY: ${AI_PROVIDER_FERNET_KEY:-b98esSSrtceWc4IUOFGR-f_6I8FfnxtpjjYQZN51RCw=}
      APP_ENV: ${APP_ENV:-production}
      # Required substitution: do not default to development in this compose file.
      APP_BUILD_REVISION: ${APP_BUILD_REVISION:?Set APP_BUILD_REVISION to a deployment-immutable value}
      # Plan 03 live model capability probe (paid Provider call). Default-disabled.
      AI_MODEL_CAPABILITY_PROBE_ENABLED: ${AI_MODEL_CAPABILITY_PROBE_ENABLED:-false}
      # Plan 04 main agent feature mode (production default off).
      ASSISTANT_MAIN_AGENT_MODE: ${ASSISTANT_MAIN_AGENT_MODE:-off}
      # Plan 07 durable human Interrupts (default off; pepper from deployment secret only).
      ASSISTANT_DURABLE_INTERRUPTS_ENABLED: ${ASSISTANT_DURABLE_INTERRUPTS_ENABLED:-false}
      ASSISTANT_INTERRUPT_DEFAULT_TTL_SEC: ${ASSISTANT_INTERRUPT_DEFAULT_TTL_SEC:-86400}
      ASSISTANT_INTERRUPT_MAX_TTL_SEC: ${ASSISTANT_INTERRUPT_MAX_TTL_SEC:-604800}
      ASSISTANT_INTERRUPT_COMMENT_MAX_CHARS: ${ASSISTANT_INTERRUPT_COMMENT_MAX_CHARS:-4000}
      ASSISTANT_INTERRUPT_TOKEN_PEPPER: ${ASSISTANT_INTERRUPT_TOKEN_PEPPER:-}
      LIGHTRAG_ENABLED: "${LIGHTRAG_ENABLED:-true}"
      DOCLING_WORKER_ENABLED: "${DOCLING_WORKER_ENABLED:-true}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      LIGHTRAG_EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mindatlas}
      MINIO_SECURE: "false"
      ASSISTANT_ARTIFACT_BUCKET: ${ASSISTANT_ARTIFACT_BUCKET:-mindatlas-assistant-artifacts}
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      # Storage
      LIGHTRAG_WORKING_DIR: /app/lightrag_storage
      TIKTOKEN_CACHE_DIR: /app/lightrag_storage/tiktoken_cache
    volumes:
      - lightrag_storage:/app/lightrag_storage
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - mindatlas-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # LightRAG Worker (background indexing)
  lightrag-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: worker
    container_name: mindatlas-lightrag-worker
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mindatlas}
      # Quick-start friendly defaults. Override these from `.env` in production if needed.
      AI_PROVIDER_FERNET_KEY: ${AI_PROVIDER_FERNET_KEY:-b98esSSrtceWc4IUOFGR-f_6I8FfnxtpjjYQZN51RCw=}
      LIGHTRAG_ENABLED: "${LIGHTRAG_ENABLED:-true}"
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      LIGHTRAG_WORKER_ENABLED: "${LIGHTRAG_WORKER_ENABLED:-true}"
      LIGHTRAG_EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      # Storage
      LIGHTRAG_WORKING_DIR: /app/lightrag_storage
      TIKTOKEN_CACHE_DIR: /app/lightrag_storage/tiktoken_cache
    volumes:
      - lightrag_storage:/app/lightrag_storage
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - mindatlas-network
    restart: unless-stopped

  # Parse Worker (Docling document parsing)
  docling-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: parse-worker
    container_name: mindatlas-docling-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mindatlas}
      # Quick-start friendly defaults. Override these from `.env` in production if needed.
      AI_PROVIDER_FERNET_KEY: ${AI_PROVIDER_FERNET_KEY:-b98esSSrtceWc4IUOFGR-f_6I8FfnxtpjjYQZN51RCw=}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mindatlas}
      MINIO_SECURE: "false"
      ASSISTANT_ARTIFACT_BUCKET: ${ASSISTANT_ARTIFACT_BUCKET:-mindatlas-assistant-artifacts}
      DOCLING_WORKER_ENABLED: "${DOCLING_WORKER_ENABLED:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - mindatlas-network
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  # Durable Main Agent assistant worker (Plan 06)
  # Same database / provider Fernet key / private MinIO Artifact bucket as the API.
  # HEALTHCHECK validates a fresh compatible registration (not mere PID liveness).
  assistant-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: assistant-worker
      args:
        APP_BUILD_REVISION: ${APP_BUILD_REVISION:?Set APP_BUILD_REVISION to a deployment-immutable value}
    container_name: mindatlas-assistant-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mindatlas}
      AI_PROVIDER_FERNET_KEY: ${AI_PROVIDER_FERNET_KEY:-b98esSSrtceWc4IUOFGR-f_6I8FfnxtpjjYQZN51RCw=}
      APP_ENV: ${APP_ENV:-production}
      APP_BUILD_REVISION: ${APP_BUILD_REVISION:?Set APP_BUILD_REVISION to a deployment-immutable value}
      ASSISTANT_MAIN_AGENT_MODE: ${ASSISTANT_MAIN_AGENT_MODE:-off}
      # Plan 07 durable human Interrupts (default off; pepper from deployment secret only).
      ASSISTANT_DURABLE_INTERRUPTS_ENABLED: ${ASSISTANT_DURABLE_INTERRUPTS_ENABLED:-false}
      ASSISTANT_INTERRUPT_DEFAULT_TTL_SEC: ${ASSISTANT_INTERRUPT_DEFAULT_TTL_SEC:-86400}
      ASSISTANT_INTERRUPT_MAX_TTL_SEC: ${ASSISTANT_INTERRUPT_MAX_TTL_SEC:-604800}
      ASSISTANT_INTERRUPT_COMMENT_MAX_CHARS: ${ASSISTANT_INTERRUPT_COMMENT_MAX_CHARS:-4000}
      ASSISTANT_INTERRUPT_TOKEN_PEPPER: ${ASSISTANT_INTERRUPT_TOKEN_PEPPER:-}
      # Private Artifact storage (never the attachment public-download bucket)
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mindatlas}
      MINIO_SECURE: "false"
      ASSISTANT_ARTIFACT_BUCKET: ${ASSISTANT_ARTIFACT_BUCKET:-mindatlas-assistant-artifacts}
      # Worker lease / registration knobs (defaults match Settings)
      ASSISTANT_WORKER_POLL_INTERVAL_MS: ${ASSISTANT_WORKER_POLL_INTERVAL_MS:-500}
      ASSISTANT_WORKER_LEASE_TTL_SEC: ${ASSISTANT_WORKER_LEASE_TTL_SEC:-30}
      ASSISTANT_WORKER_HEARTBEAT_INTERVAL_SEC: ${ASSISTANT_WORKER_HEARTBEAT_INTERVAL_SEC:-5}
      ASSISTANT_WORKER_REGISTRATION_TTL_SEC: ${ASSISTANT_WORKER_REGISTRATION_TTL_SEC:-20}
      ASSISTANT_WORKER_STATE_PATH: /tmp/mindatlas-assistant-worker-state.json
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - mindatlas-network
    # Image HEALTHCHECK already runs: python -m app.assistant.worker --healthcheck
    restart: unless-stopped

  # Web Frontend (Nginx)
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mindatlas-web
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mindatlas-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  neo4j_data:
  neo4j_logs:
  lightrag_storage:


networks:
  mindatlas-network:
    driver: bridge
