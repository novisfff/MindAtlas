name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Required by settings/crypto for many integration tests; 32-byte base64 test key.
      AI_PROVIDER_FERNET_KEY: "07v02gVBdreNrXjLJZkIMdohHtgy6aDFKBHxakHjbrQ="
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify direct PyYAML and jsonschema imports
        run: |
          python - <<'PY'
          import importlib.metadata
          import yaml
          import jsonschema

          print("PyYAML", importlib.metadata.version("PyYAML"))
          print("jsonschema", importlib.metadata.version("jsonschema"))
          assert yaml.__name__ == "yaml"
          assert jsonschema.__name__ == "jsonschema"
          PY

      - name: Run backend tests
        run: python -m pytest -q

      - name: Plan 09 lifecycle process harness
        run: |
          python -m pytest -q \
            tests/test_plan09_lifecycle_e2e.py \
            tests/test_skill_two_gate_lifecycle.py \
            tests/test_skill_eval_real_orchestration.py \
            tests/test_skill_publish_gate.py \
            tests/test_skill_eval_api.py

  operator-control-plane:
    name: Operator Control Plane Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mindatlas
          POSTGRES_PASSWORD: mindatlas
          POSTGRES_DB: mindatlas_test_plan08_operator_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindatlas -d mindatlas_test_plan08_operator_auth_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database only — never production credentials.
      DATABASE_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_operator_auth_ci
      MINDATLAS_TEST_POSTGRES_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_operator_auth_ci
      # Hard-fail release-critical operator-auth PostgreSQL suite when URL missing.
      MINDATLAS_REQUIRE_POSTGRES: "1"
      MINDATLAS_TEST_POSTGRES_DESTRUCTIVE: "1"
      AI_PROVIDER_FERNET_KEY: "07v02gVBdreNrXjLJZkIMdohHtgy6aDFKBHxakHjbrQ="
      # Origin only at job scope — operator secrets stay step-scoped so
      # test_settings_constructible_without_auth_secrets stays honest under CI.
      MINDATLAS_CANONICAL_ORIGIN: "http://localhost:3000"
      APP_ENV: test
      APP_BUILD_REVISION: "ci-operator-control-plane"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Operator auth and route-inventory suites
        env:
          # Synthetic test-only operator secrets (disposable; never production values).
          # Setup material is 48 url-safe bytes; HMAC keys are 32-byte base64.
          MINDATLAS_INITIAL_SETUP_TOKEN: "ci-only-operator-setup-material-not-for-production-use-48b"
          MINDATLAS_SESSION_HMAC_ACTIVE_KEY_ID: "ci_active"
          MINDATLAS_SESSION_HMAC_KEYS: '{"ci_active":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
        run: |
          set -euo pipefail
          # Fixed Plan 1 suites. MINDATLAS_REQUIRE_POSTGRES=1 makes the
          # postgres module hard-fail (not skip) when the URL is absent.
          python -m pytest -q \
            tests/test_operator_password.py \
            tests/test_operator_auth_config.py \
            tests/test_operator_auth_service.py \
            tests/test_operator_auth_api.py \
            tests/test_operator_auth_postgres.py \
            tests/test_route_auth_inventory.py \
            tests/test_operator_cli_boundary.py \
            tests/test_operator_control_plane_evidence.py

      - name: Reject skipped release-critical postgres suite
        env:
          MINDATLAS_INITIAL_SETUP_TOKEN: "ci-only-operator-setup-material-not-for-production-use-48b"
          MINDATLAS_SESSION_HMAC_ACTIVE_KEY_ID: "ci_active"
          MINDATLAS_SESSION_HMAC_KEYS: '{"ci_active":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
        run: |
          set -euo pipefail
          # Re-run the postgres module alone and fail if any test was skipped.
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          env = dict(os.environ)
          env["MINDATLAS_REQUIRE_POSTGRES"] = "1"
          proc = subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pytest",
                  "tests/test_operator_auth_postgres.py",
                  "-q",
              ],
              env=env,
              capture_output=True,
              text=True,
          )
          out = (proc.stdout or "") + "\n" + (proc.stderr or "")
          print(out)
          if proc.returncode != 0:
              raise SystemExit(proc.returncode)
          lower = out.lower()
          match = re.search(r"(\d+)\s+skipped", lower)
          if match and int(match.group(1)) > 0:
              raise SystemExit(
                  "operator-auth postgres suite skipped under require-postgres; "
                  "release-critical gate must run"
              )
          if "passed" not in lower:
              raise SystemExit(
                  "operator-auth postgres suite produced no pass summary"
              )
          print("operator-auth postgres gate: OK")
          PY

  agent-skill-migration:
    name: Agent Skill PostgreSQL Migration Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mindatlas
          POSTGRES_PASSWORD: mindatlas
          POSTGRES_DB: mindatlas_test_plan08_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindatlas -d mindatlas_test_plan08_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database only. PRE_PLAN01_HEAD=a7b8c9d0e1f2; Plan 01=acf208493c87.
      DATABASE_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_ci
      MINDATLAS_TEST_POSTGRES_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_ci
      # Minimal app config required by settings import during alembic env.
      AI_PROVIDER_FERNET_KEY: "07v02gVBdreNrXjLJZkIMdohHtgy6aDFKBHxakHjbrQ="
      # Plan 2 downgrade is intentionally permitted only in an explicit test env.
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify direct PyYAML and jsonschema imports
        run: |
          python - <<'PY'
          import importlib.metadata
          import yaml
          import jsonschema

          print("PyYAML", importlib.metadata.version("PyYAML"))
          print("jsonschema", importlib.metadata.version("jsonschema"))
          assert yaml.__name__ == "yaml"
          assert jsonschema.__name__ == "jsonschema"
          PY

      - name: Alembic fresh upgrade gate
        run: |
          set -euo pipefail
          alembic upgrade 027869a00a47
          alembic current

      - name: PostgreSQL migration preservation and guard tests
        env:
          MINDATLAS_TEST_POSTGRES_DESTRUCTIVE: "1"
          # Plan 1 tip refuses destructive downgrade outside disposable non-prod
          # DBs — same ACK used by the upgrade/downgrade/upgrade gate above.
          MINDATLAS_TEST_DESTRUCTIVE_DOWNGRADE: "1"
          # Do NOT set PLAN09_EVAL / PLAN08 ledger ACKs here — guarded-downgrade
          # tests must observe blocked paths. Suites set ACKs only around intentional
          # cleanup/downgrade helpers.
        run: |
          python -m pytest tests/test_agent_skill_postgres_migration.py tests/test_provider_model_probe_postgres.py tests/test_main_agent_postgres_migration.py tests/test_capability_call_migration_postgres.py tests/test_agent_skill_admin_postgres_migration.py tests/test_skill_eval_repository_postgres.py tests/test_plan09_lifecycle_postgres.py -q

      - name: System tool golden digest smoke
        run: python -m pytest tests/test_binding_json_schema.py::test_system_tool_golden_schemas_and_contract_set_digest_are_stable -q

  assistant-readiness:
    name: Assistant Seed And Readiness Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mindatlas
          POSTGRES_PASSWORD: mindatlas
          POSTGRES_DB: mindatlas_test_plan08_readiness_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindatlas -d mindatlas_test_plan08_readiness_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database only — never production credentials.
      DATABASE_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_readiness_ci
      MINDATLAS_TEST_POSTGRES_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_readiness_ci
      MINDATLAS_REQUIRE_POSTGRES: "1"
      MINDATLAS_TEST_POSTGRES_DESTRUCTIVE: "1"
      AI_PROVIDER_FERNET_KEY: "07v02gVBdreNrXjLJZkIMdohHtgy6aDFKBHxakHjbrQ="
      APP_ENV: test
      APP_BUILD_REVISION: "ci-assistant-readiness"
      ASSISTANT_NEW_RUNS_ENABLED: "true"
      ASSISTANT_MAIN_AGENT_WRITE_MODE: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify assistant system seed digests
        run: python scripts/build_assistant_system_seed.py --check

      - name: Unit health/readiness and shared evaluator suites
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_health_readiness_api.py \
            tests/test_assistant_runtime_readiness.py -q

      - name: PostgreSQL readiness, bootstrap, activation, admission, and lease suites
        run: |
          set -euo pipefail
          # Hard-fail when URL missing via MINDATLAS_REQUIRE_POSTGRES=1 (job env).
          python -m pytest \
            tests/test_health_readiness_postgres.py \
            tests/test_assistant_runtime_migration_postgres.py \
            tests/test_assistant_initialization_atomicity_postgres.py \
            tests/test_assistant_runtime_readiness_postgres.py \
            tests/test_assistant_runtime_activation_postgres.py \
            tests/test_assistant_atomic_admission_postgres.py \
            tests/test_assistant_worker_claim_compatibility_postgres.py \
            tests/test_durable_worker_lease_postgres.py \
            tests/test_system_initialization_concurrency_postgres.py -q

      - name: Reject skipped release-critical readiness postgres suites
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          env = dict(os.environ)
          env["MINDATLAS_REQUIRE_POSTGRES"] = "1"
          suites = [
              "tests/test_health_readiness_postgres.py",
              "tests/test_assistant_runtime_migration_postgres.py",
              "tests/test_assistant_initialization_atomicity_postgres.py",
              "tests/test_assistant_runtime_readiness_postgres.py",
              "tests/test_assistant_runtime_activation_postgres.py",
              "tests/test_assistant_atomic_admission_postgres.py",
              "tests/test_assistant_worker_claim_compatibility_postgres.py",
              "tests/test_durable_worker_lease_postgres.py",
              "tests/test_system_initialization_concurrency_postgres.py",
          ]
          proc = subprocess.run(
              [sys.executable, "-m", "pytest", *suites, "-q"],
              env=env,
              capture_output=True,
              text=True,
          )
          out = (proc.stdout or "") + "\n" + (proc.stderr or "")
          print(out)
          if proc.returncode != 0:
              raise SystemExit(proc.returncode)
          lower = out.lower()
          match = re.search(r"(\d+)\s+skipped", lower)
          if match and int(match.group(1)) > 0:
              raise SystemExit(
                  "assistant readiness postgres suites skipped under require-postgres; "
                  "release-critical gate must run"
              )
          if "passed" not in lower:
              raise SystemExit(
                  "assistant readiness postgres suites produced no pass summary"
              )
          print("assistant readiness postgres gate: OK")
          PY

  main-agent-bootstrap-smoke:
    name: Main Agent Bootstrap Compose Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_BUILD_REVISION: "ci-main-agent-bootstrap-smoke"
      ASSISTANT_NEW_RUNS_ENABLED: "true"
      ASSISTANT_MAIN_AGENT_WRITE_MODE: "off"
      # Disposable CI Fernet only — never production material.
      AI_PROVIDER_FERNET_KEY: "07v02gVBdreNrXjLJZkIMdohHtgy6aDFKBHxakHjbrQ="
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Unit tests for smoke evidence, stub, and SSRF gate
        run: |
          set -euo pipefail
          python -m pytest tests/test_main_agent_bootstrap_smoke_script.py -q

      - name: Fresh Compose bootstrap-to-chat smoke
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/smoke_main_agent_bootstrap.py \
            --compose-file ../deploy/docker-compose.yml \
            --overlay-file ../deploy/compose.main-agent-smoke.yml \
            --build-revision "${APP_BUILD_REVISION}" \
            --pull-request-head-sha "${PULL_REQUEST_HEAD_SHA}" \
            --output "${RUNNER_TEMP}/main-agent-bootstrap-readiness.json"

      - name: Validate evidence allowlist and digest
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export CHECKOUT_COMMIT_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.smoke_main_agent_bootstrap import validate_evidence

          path = Path(os.environ["RUNNER_TEMP"]) / "main-agent-bootstrap-readiness.json"
          if not path.is_file():
              raise SystemExit("evidence file missing after smoke")
          payload = json.loads(path.read_text(encoding="utf-8"))
          validate_evidence(payload)
          assert payload["checkoutCommitSha"] == os.environ["CHECKOUT_COMMIT_SHA"]
          assert payload["pullRequestHeadSha"] == os.environ["PULL_REQUEST_HEAD_SHA"]
          assert payload["activeRuntimeKind"] == "main_agent"
          assert payload["chatRunCount"] == 1
          assert payload["chatTerminalStatus"] == "completed"
          assert payload["alembicHead"] == "b6e2d4f8a901"
          print("main agent bootstrap evidence: OK")
          PY

      - name: Upload sanitized evidence artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-agent-bootstrap-readiness-evidence
          path: ${{ runner.temp }}/main-agent-bootstrap-readiness.json
          if-no-files-found: error

  frontend:
    name: Frontend Build And Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Plan 09 lifecycle frontend component evidence
        run: |
          npm run test -- --run \
            src/features/assistant-config/plan09-lifecycle.e2e.test.tsx \
            src/features/assistant-config/pages/UniversalSkillEditorPage.test.tsx \
            src/features/assistant-config/components/Plan09RouteGate.test.tsx

      - name: Run frontend build
        run: npm run build
