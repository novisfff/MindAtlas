name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Required by settings/crypto for many integration tests; 32-byte base64 test key.
      AI_PROVIDER_FERNET_KEY: "07v02gVBdreNrXjLJZkIMdohHtgy6aDFKBHxakHjbrQ="
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify direct PyYAML and jsonschema imports
        run: |
          python - <<'PY'
          import importlib.metadata
          import yaml
          import jsonschema

          print("PyYAML", importlib.metadata.version("PyYAML"))
          print("jsonschema", importlib.metadata.version("jsonschema"))
          assert yaml.__name__ == "yaml"
          assert jsonschema.__name__ == "jsonschema"
          PY

      - name: Run backend tests
        run: python -m pytest -q

  agent-skill-migration:
    name: Agent Skill PostgreSQL Migration Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mindatlas
          POSTGRES_PASSWORD: mindatlas
          POSTGRES_DB: mindatlas_test_plan08_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindatlas -d mindatlas_test_plan08_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database only. PRE_PLAN01_HEAD=a7b8c9d0e1f2; Plan 01=acf208493c87.
      DATABASE_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_ci
      MINDATLAS_TEST_POSTGRES_URL: postgresql://mindatlas:mindatlas@localhost:5432/mindatlas_test_plan08_ci
      # Minimal app config required by settings import during alembic env.
      AI_PROVIDER_FERNET_KEY: "07v02gVBdreNrXjLJZkIMdohHtgy6aDFKBHxakHjbrQ="
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify direct PyYAML and jsonschema imports
        run: |
          python - <<'PY'
          import importlib.metadata
          import yaml
          import jsonschema

          print("PyYAML", importlib.metadata.version("PyYAML"))
          print("jsonschema", importlib.metadata.version("jsonschema"))
          assert yaml.__name__ == "yaml"
          assert jsonschema.__name__ == "jsonschema"
          PY

      - name: Alembic upgrade / downgrade / upgrade gate
        env:
          # Plan 08/09 guarded downgrades need explicit acks on disposable CI DBs.
          MINDATLAS_PLAN08_DOWNGRADE_ACK_PURGE_LEDGER_DATA: "1"
          MINDATLAS_PLAN09_EVAL_DOWNGRADE_ACK: "1"
        run: |
          set -euo pipefail
          alembic upgrade head
          # Prepare Plan 09 guarded downgrade: terminalize active runs, drop
          # gate_use delete trigger + clear uses (pin guard), clear lifecycle
          # archive/catalog evidence. Immutable eval tables are dropped by
          # the migration once ACK is set — do not DELETE them here.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["DATABASE_URL"].replace(
              "postgresql://", "postgresql+psycopg2://", 1
          )
          eng = create_engine(url, future=True)
          with eng.begin() as conn:
              existing = {
                  r[0]
                  for r in conn.execute(
                      text(
                          "SELECT table_name FROM information_schema.tables "
                          "WHERE table_schema='public'"
                      )
                  )
              }
              if "assistant_skill_eval_run" in existing:
                  conn.execute(
                      text(
                          "UPDATE assistant_skill_eval_run "
                          "SET status = 'cancelled', "
                          "    ended_at = COALESCE(ended_at, NOW()), "
                          "    state_revision = state_revision + 1 "
                          "WHERE status IN ('queued', 'running', 'cancelling')"
                      )
                  )
              if "assistant_skill_publish_gate_use" in existing:
                  conn.execute(
                      text(
                          "DROP TRIGGER IF EXISTS "
                          "trg_assistant_skill_publish_gate_use_reject_delete "
                          "ON assistant_skill_publish_gate_use"
                      )
                  )
                  conn.execute(text("DELETE FROM assistant_skill_publish_gate_use"))
              if "assistant_skill_package" in existing:
                  conn.execute(
                      text(
                          "UPDATE assistant_skill_package SET "
                          "archived_at=NULL, archived_by=NULL, "
                          "catalog_enabled_at=NULL, catalog_enabled_by=NULL, "
                          "catalog_enabled=false"
                      )
                  )
              if "assistant_skill_package_alias" in existing:
                  conn.execute(
                      text(
                          "UPDATE assistant_skill_package_alias SET "
                          "disabled_at=NULL, disabled_by=NULL"
                      )
                  )
              if "assistant_main_agent_profile" in existing:
                  conn.execute(
                      text(
                          "UPDATE assistant_main_agent_profile SET runtime_enabled=false"
                      )
                  )
          eng.dispose()
          print("plan09 downgrade prepared")
          PY
          alembic downgrade a7b8c9d0e1f2
          alembic upgrade head
          alembic current
          alembic heads

      - name: PostgreSQL migration preservation and guard tests
        env:
          MINDATLAS_TEST_POSTGRES_DESTRUCTIVE: "1"
          # Do NOT set PLAN09_EVAL / PLAN08 ledger ACKs here — guarded-downgrade
          # tests must observe blocked paths. Suites set ACKs only around intentional
          # cleanup/downgrade helpers.
        run: python -m pytest tests/test_agent_skill_postgres_migration.py tests/test_provider_model_probe_postgres.py tests/test_main_agent_postgres_migration.py tests/test_capability_call_migration_postgres.py tests/test_agent_skill_admin_postgres_migration.py tests/test_skill_eval_repository_postgres.py -q

      - name: System tool golden digest smoke
        run: python -m pytest tests/test_binding_json_schema.py::test_system_tool_golden_schemas_and_contract_set_digest_are_stable -q

  frontend:
    name: Frontend Build And Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run frontend build
        run: npm run build
